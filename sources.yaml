# =====================================================================
#  SOURCES SURVEILLÉES
# ---------------------------------------------------------------------
#  Pour chaque source :
#    nom      : nom affiché dans Notion
#    site     : page d'accueil (sert à détecter automatiquement un flux RSS)
#    flux     : flux RSS/Atom connus (on les essaie en premier)
#    pages    : pages « liste des publications » lues directement, pour les
#               sites sans flux RSS fiable. « motif » = expression régulière
#               que doit respecter l'adresse d'un article (facultatif).
#               « rendu: true » = page construite en JavaScript (lue via Jina).
#    podcast  : true si la source est un podcast (transcription audio)
#    itunes   : recherche du flux podcast sur Apple Podcasts (facultatif)
#    exclure  : motif d'adresses à ignorer (facultatif)
#
#  Pour ajouter une source : copiez un bloc et adaptez-le. Si vous ne
#  connaissez pas le flux, mettez seulement « site » : le programme le
#  cherchera tout seul.
# =====================================================================

