    - https://www.crisisgroup.org/rss/73
    - https://www.crisisgroup.org/rss/81
    - https://www.crisisgroup.org/rss/4697

# ⚠️ Le site du FMI bloque les robots depuis les serveurs cloud (erreur 403) et
#    ses flux RSS ont été supprimés. Source conservée pour le cas où cela changerait.
- nom: FMI
  site: https://www.imf.org/fr/home
  flux:
    - https://www.imf.org/en/Publications/RSS?language=eng
    - https://www.imf.org/en/News/RSS?language=eng
    - https://www.imf.org/fr/News/RSS?language=fre
  pages:
    - url: https://www.imf.org/en/News/SearchNews
      motif: 'imf\.org/en/News/Articles/20\d\d/'
      rendu: true
    - url: https://www.imf.org/en/Publications/Search
      motif: 'imf\.org/en/Publications/[A-Za-z-]+/Issues/20\d\d/'
      rendu: true

