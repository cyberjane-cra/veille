# =====================================================================
#  RÉGLAGES DE LA VEILLE DES RAPPORTS PUBLICS
#  (la liste des organes suivis est dans sources-rapports.yaml)
# =====================================================================

limites:
  duree_max_minutes: 45            # durée max d'un passage
  jours_premier_passage: 21        # au premier passage : rapports des 3 dernières semaines
  liens_max_par_page: 40           # sites sans flux RSS : liens examinés par page
  tri_par_passage: 80              # publications triées par l'IA (vrai rapport ? portée nationale ?)

# Rapports ne concernant qu'une collectivité ou un établissement local (ex. contrôle d'une commune)
garder_rapports_locaux: false

fiches:
  fiches_par_passage: 5            # fiches très détaillées rédigées à chaque passage (passage toutes les heures)
  pause_entre_fiches_secondes: 30  # respecte la limite de volume par minute des modèles gratuits
  etoile_jours: 3                  # durée de l'⭐ « nouveau rapport »
  pages_pdf_max: 400               # pages lues dans le PDF du rapport
  # Lecture intégrale : jusqu'à ce seuil (~90 pages), le rapport entier est envoyé à l'IA en une fois ;
  # au-delà, il est lu partie par partie (notes de lecture détaillées), puis la fiche est rédigée
  # à partir de toutes ces notes. Aucune partie du rapport n'est sautée.
  lecture_integrale_max_caracteres: 250000
  taille_partie_caracteres: 100000   # ~35 pages par partie
  parties_max: 12                    # au-delà (~420 pages), les dernières parties (annexes) sont regroupées
  pause_entre_parties_secondes: 8
  # Les fiches rédigées avant la version « éléments de langage + avantages/limites » sont refaites
  # (une fois la file des nouveaux rapports vidée), pour alimenter les super fiches.
  reprendre_anciennes_fiches: true

liens_lois:
  mois_lois_promulguees: 24        # rattachement possible aux lois promulguées depuis moins de 24 mois

# ---------------------------------------------------------------------
# SUPER FICHES : quand plusieurs rapports portent sur le même sujet ou se complètent,
# l'IA les réunit dans une « super fiche » 🔷, rangée dans le dossier thématique du sujet.
# ---------------------------------------------------------------------
super_fiches:
  actif: true
  super_fiches_par_passage: 2        # super fiches créées ou mises à jour à chaque passage
  pause_secondes: 30
  rapports_lus_max: 30               # rapports exploités pour la synthèse (les plus récents) ;
                                     # le tableau reprend TOUTES les recommandations
  regroupement_par_appel: 20         # nouveaux rapports examinés à la fois pour le regroupement par sujet

# ---------------------------------------------------------------------
# DOSSIERS THÉMATIQUES (sous-pages de « Veille administrative ») et colonne « Thèmes »
# Familles reprises de la veille presse (Sécurité & défense, Politique & institutions,
# Économie & ressources, Technologies & information, Environnement, Société) et enrichies
# des grandes politiques publiques. L'IA choisit 1 à 5 thèmes par rapport.
# Pas de virgule dans les noms de thèmes (contrainte de Notion).
# ---------------------------------------------------------------------
familles_thematiques:
  - famille: Finances publiques et fiscalité
    icone: "💶"
    couleur: red
    themes:
      - Finances publiques et dette
      - Prélèvements obligatoires et fiscalité
      - Finances locales
  - famille: Protection sociale et santé
    icone: "🩺"
    couleur: blue
    themes:
      - Protection sociale et retraites
      - Santé et assurance maladie
      - Hôpital et offre de soins
      - Santé publique et prévention
      - Handicap et autonomie
  - famille: Société et solidarités
    icone: "🤝"
    couleur: pink
    themes:
      - Famille et enfance
      - Pauvreté et exclusion
      - Égalité et lutte contre les discriminations
      - Migrations et intégration
      - Jeunesse et sport
  - famille: Économie, travail et entreprises
    icone: "🏭"
    couleur: yellow
    themes:
      - Conjoncture et macroéconomie
      - Travail et emploi
      - Formation professionnelle et apprentissage
      - Compétitivité et entreprises
      - Industrie et souveraineté économique
      - Commerce et concurrence
      - Agriculture et alimentation
  - famille: Environnement, climat et énergie
    icone: "🌿"
    couleur: green
    themes:
      - Climat
      - Énergie
      - Biodiversité et ressources naturelles
  - famille: Numérique et information
    icone: "💻"
    couleur: purple
    themes:
      - Numérique et IA
      - Cybersécurité et données personnelles
      - Médias et information
  - famille: Éducation, recherche et culture
    icone: "🎓"
    couleur: default
    themes:
      - Éducation et enseignement scolaire
      - Enseignement supérieur et recherche
      - Culture et patrimoine
  - famille: Territoires, logement et mobilités
    icone: "🏘️"
    couleur: brown
    themes:
      - Logement et urbanisme
      - Collectivités territoriales
      - Transports et mobilités
      - Outre-mer
      - Aménagement du territoire et ruralité
  - famille: Institutions, justice et sécurité
    icone: "⚖️"
    couleur: gray
    themes:
      - Institutions et administration
      - Fonction publique
      - Justice
      - Sécurité intérieure
      - Droits et libertés
  - famille: Europe, défense et international
    icone: "🌍"
    couleur: orange
    themes:
      - Union européenne
      - Défense
      - Action extérieure et aide au développement
