# =====================================================================
#  ORGANES SUIVIS PAR LA VEILLE DES RAPPORTS PUBLICS
# ---------------------------------------------------------------------
#  Même format que sources.yaml (veille presse), avec en plus :
#    famille       : regroupement affiché dans Notion
#    titre_motif   : (facultatif) le titre doit contenir ce motif pour être retenu
#    titre_exclure : (facultatif) titres à écarter (ex. rapports sur un projet de loi,
#                    déjà suivis par la veille législative)
#  Les sources sans flux RSS sont lues sur leur page de publications (« pages ») ;
#  elles n'ont pas de ligne « site » pour éviter la détection automatique de flux
#  d'actualités généralistes.
#  Au premier passage, les publications non datées de ces pages servent de point
#  de départ : seules les NOUVELLES publications sont ensuite traitées.
#  Vie-publique.fr (rubrique « Rapports publics ») sert de filet de sécurité :
#  elle recense des rapports de très nombreux organes ; les doublons sont écartés.
# =====================================================================

# ---------------- Juridictions financières ----------------
# ⚠️ ccomptes.fr, hcfp.fr et securite-sociale.fr (HCFiPS, HCAAM) ne répondent pas aux serveurs
#    de GitHub (diagnostics des 4/10/2026). Leurs rapports arrivent par vie-publique.fr
#    (rubrique « Rapports publics »), qui reprend ceux de la Cour le jour même. Sources
#    conservées pour le cas où l'accès s'ouvrirait. Le CNLE (même problème) est retiré.
- nom: Cour des comptes
  famille: Juridictions financières
  site: https://www.ccomptes.fr/fr
  ssl_non_verifie: true   # site injoignable depuis GitHub au 1er diagnostic ; rapports aussi repris par vie-publique
  flux:
    - https://www.ccomptes.fr/rss/juridiction/98

- nom: Conseil des prélèvements obligatoires (CPO)
  famille: Juridictions financières
  site: https://www.ccomptes.fr/fr
  ssl_non_verifie: true
  flux:
    - https://www.ccomptes.fr/rss/juridiction/201
  pages:
    - url: https://www.ccomptes.fr/fr/institutions-associees/conseil-des-prelevements-obligatoires-cpo
      motif: 'ccomptes\.fr/fr/publications/[a-z0-9-]+'

- nom: Haut Conseil des finances publiques (HCFP)
  famille: Juridictions financières
  ssl_non_verifie: true
  pages:
    - url: https://www.hcfp.fr/liste-avis
      motif: 'hcfp\.fr/(?:liste-avis/[a-z0-9-]+|sites/default/files/.+\.pdf)'

# ---------------- Parlement ----------------
- nom: Sénat
  famille: Parlement
  site: https://www.senat.fr/
  flux:
    - https://www.senat.fr/rss/rapports.rss
  # Rapports d'information, commissions d'enquête, délégations, OPECST ;
  # les rapports sur un texte (projet/proposition de loi) sont écartés.
  titre_exclure: '(?i)(sur le projet de loi|sur la proposition de loi|sur le projet de loi de finances|avis présenté|fait au nom de la commission mixte paritaire|texte de la commission|sur la proposition de résolution)'

- nom: Assemblée nationale
  famille: Parlement
  site: https://www.assemblee-nationale.fr/
  flux:
    - https://www2.assemblee-nationale.fr/feeds/detail/documents-parlementaires
  pages:
    - url: https://www.assemblee-nationale.fr/dyn/actualites-accueil-hub/les-rapports-d-information-publies-pendant-la-session-2026-2027
      motif: 'assemblee-nationale\.fr/dyn/(?:old/)?17/rap-(?:info|enq)/'
    - url: https://www.assemblee-nationale.fr/dyn/actualites-accueil-hub/les-rapports-d-information-publies-pendant-la-session-2025-2026
      motif: 'assemblee-nationale\.fr/dyn/(?:old/)?17/rap-(?:info|enq)/'
  titre_motif: '(?i)(rapport d.information|commission d.enquête|mission d.information|rap-info|rap-enq|évaluation|contrôle)'
  titre_exclure: '(?i)(sur le projet de loi|sur la proposition de loi|avis présenté|proposition de résolution)'

