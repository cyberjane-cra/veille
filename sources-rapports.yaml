# ---------------- Inspections générales ----------------
# L'IGA et l'IGÉSR refusent les serveurs de GitHub (erreur 403) : leurs rapports publics
# sont repris par vie-publique.fr (filet de sécurité), sans lecture directe de leur site.
- nom: Inspection générale des finances (IGF)
  famille: Inspections générales
  pages:
    - url: https://www.igf.finances.gouv.fr/sites/igf/accueil/rapports-publics/nos-dernieres-publications.html

- nom: Inspection générale des affaires sociales (IGAS)
  famille: Inspections générales
  pages:
    - url: https://igas.gouv.fr/nos-rapports
      motif: 'igas\.gouv\.fr/(?!nos-rapports$)[a-z0-9-]{15,}$'

- nom: Inspection générale de l'environnement et du développement durable (IGEDD)
  famille: Inspections générales
  pages:
    - url: https://igedd.documentation.developpement-durable.gouv.fr/recherche
      motif: 'igedd\.documentation\.developpement-durable\.gouv\.fr/(?:notice|document)'

